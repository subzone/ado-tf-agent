<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terraform plan</title>
  </head>
  <body>
    <div id="app">
      <p class="muted">Loading Terraform plan…</p>
    </div>
    <script>
      // The ADO host provides an AMD loader with the SDK already in its cache.
      // We must capture it BEFORE our bundle runs, so our code uses the same
      // XDM channel instance that the host already handshook with.
      function loadBundle() {
        var s = document.createElement("script");
        s.src = "planTab.bundle.js";
        document.body.appendChild(s);
      }

      if (typeof require === "function" && typeof define === "function" && define.amd) {
        require(["azure-devops-extension-sdk"], function(sdk) {
          window.__AzureDevOpsSDK = sdk;
          loadBundle();
        });
      } else {
        loadBundle();
      }
    </script>
  </body>
</html>
