<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b2fff"/>
      <stop offset="100%" style="stop-color:#4a90d9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#00a8ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="128" height="128" rx="18" ry="18" fill="url(#bg)"/>

  <!-- Terraform-style diamond / hexagon shape (main) -->
  <!-- Left shard -->
  <polygon points="22,44 46,30 46,64 22,78" fill="url(#diamond)" opacity="0.9"/>
  <!-- Right shard -->
  <polygon points="50,28 74,14 74,48 50,62" fill="url(#diamond)" opacity="0.7"/>
  <!-- Bottom shard -->
  <polygon points="22,82 46,68 46,102 22,116" fill="url(#diamond)" opacity="0.5"/>

  <!-- Dependency graph nodes on the right side -->
  <!-- Node 1 - top (create = green) -->
  <circle cx="95" cy="30" r="8" fill="#107c10" opacity="0.95" filter="url(#glow)"/>
  <circle cx="95" cy="30" r="5" fill="#dff6dd"/>

  <!-- Node 2 - middle (update = yellow) -->
  <circle cx="95" cy="64" r="8" fill="#c8a400" opacity="0.95" filter="url(#glow)"/>
  <circle cx="95" cy="64" r="5" fill="#fff4ce"/>

  <!-- Node 3 - bottom (delete = red) -->
  <circle cx="95" cy="98" r="8" fill="#a4262c" opacity="0.95" filter="url(#glow)"/>
  <circle cx="95" cy="98" r="5" fill="#fde7e9"/>

  <!-- Edges between nodes -->
  <line x1="95" y1="38" x2="95" y2="56" stroke="url(#accent)" stroke-width="2" opacity="0.7"/>
  <line x1="95" y1="72" x2="95" y2="90" stroke="url(#accent)" stroke-width="2" opacity="0.7"/>

  <!-- Edge from diamond to graph -->
  <line x1="74" y1="38" x2="87" y2="30" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>
  <line x1="74" y1="48" x2="87" y2="64" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>

  <!-- "TF" text subtle watermark at bottom -->
  <text x="64" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700"
        fill="#ffffff" opacity="0.25" text-anchor="middle" letter-spacing="3">TF</text>
</svg>
