# Azure DevOps pipeline using the ADO Terraform Agent extension task.
#
# Task reference (4 parts before @): publisher.extensionId.contributionId.taskJsonName@major
#   subzone · ado-tf-agent · terraform-task · Terraform · @0
#   task.json "name" is Terraform — omitting it causes "A task is missing".
#
# If you see "A task is missing", the extension is NOT installed on THIS Azure DevOps organization.
# Install it first:
#   Organization Settings (gear) → Extensions → Shared → Upload extension → select the .vsix
#   OR Browse marketplace → search "ADO Terraform Agent" (if published publicly).
# Then re-run the pipeline. Same org must host both the project and the extension.

trigger:
  branches:
    include:
      - main
      - master

pool:
  vmImage: ubuntu-latest

variables:
  tfWorkingDirectory: infra
  terraformVersion: 1.7.5

steps:
  - checkout: self
    displayName: Checkout repository

  - task: subzone.ado-tf-agent.terraform-task.Terraform@0
    displayName: Install Terraform
    inputs:
      command: install
      terraformVersion: $(terraformVersion)

  - task: subzone.ado-tf-agent.terraform-task.Terraform@0
    displayName: Terraform init (local state)
    inputs:
      command: init
      workingDirectory: $(tfWorkingDirectory)
      backendType: local

  - task: subzone.ado-tf-agent.terraform-task.Terraform@0
    displayName: Terraform validate
    inputs:
      command: validate
      workingDirectory: $(tfWorkingDirectory)

  - task: subzone.ado-tf-agent.terraform-task.Terraform@0
    displayName: Terraform plan (publishes plan.json for Terraform tab)
    inputs:
      command: plan
      workingDirectory: $(tfWorkingDirectory)
      planFile: tfplan
      publishPlanArtifact: true
      planArtifactName: terraform-plan

  - task: subzone.ado-tf-agent.terraform-task.Terraform@0
    displayName: Terraform apply (saved plan)
    inputs:
      command: apply
      workingDirectory: $(tfWorkingDirectory)
      planFile: tfplan
