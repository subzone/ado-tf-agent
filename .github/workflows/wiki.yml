name: Publish Wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Publish wiki pages
        uses: Andrew-Chen-Wang/github-wiki-action@fa78c4d658d57f4500d8ba7fa9b4d55e0202996f # v4
        with:
          path: wiki/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.WIKI_PAT }}
