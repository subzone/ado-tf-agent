name: Security Baseline

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Block private key markers
        run: |
          if git grep -nE "BEGIN (RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY" -- . ':!.github/workflows/security.yml'; then
            echo "::error::Potential private key material detected."
            exit 1
          fi

      - name: Block AWS access key patterns
        run: |
          if git grep -nE "AKIA[0-9A-Z]{16}" -- . ':!.github/workflows/security.yml'; then
            echo "::error::Potential AWS access key detected."
            exit 1
          fi

      - name: Block generic secret patterns
        run: |
          matches="$(git grep -nEi "(password|passwd|pwd|secret|token|api[_-]?key|auth[_-]?key)[[:space:]]*[:=][[:space:]]*['\"][^'\"]{8,}['\"]" \
            -- . ':!*.md' ':!.github/workflows/security.yml' || true)"

          filtered_matches="$(printf '%s\n' "$matches" | grep -Eiv "^[^:]+:[0-9]+:.*[:=][[:space:]]*['\"]?(\$\{\{[[:space:]]*(secrets|vars)\.[^}]+\}\}|\$[A-Z_][A-Z0-9_]*)['\"]?[[:space:]]*$" || true)"

          if [ -n "$filtered_matches" ]; then
            printf '%s\n' "$filtered_matches"
            echo "::error::Potential hardcoded secret detected."
            exit 1
          fi

      - name: Block Azure storage connection strings
        run: |
          if git grep -nE "DefaultEndpointsProtocol=https;AccountName=" -- . ':!*.md' ':!.github/workflows/security.yml'; then
            echo "::error::Potential Azure storage connection string detected."
            exit 1
          fi

      - name: Block GCP service account keys
        run: |
          if git grep -nE '"type":[[:space:]]*"service_account"' -- . ':!*.md' ':!.github/workflows/security.yml'; then
            echo "::error::Potential GCP service account key detected."
            exit 1
          fi
