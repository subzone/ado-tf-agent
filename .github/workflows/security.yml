name: Security Baseline

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block private key markers
        run: |
          if git grep -nE "BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY" -- . ':!*.md'; then
            echo "Potential private key material detected."
            exit 1
          fi

      - name: Block AWS access key patterns
        run: |
          if git grep -nE "AKIA[0-9A-Z]{16}" -- . ':!*.md'; then
            echo "Potential AWS key detected."
            exit 1
          fi
